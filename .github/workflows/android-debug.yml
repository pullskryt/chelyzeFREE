
name: Build Android debug APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  debug-apk:
    name: Debug APK / ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            engine: stockfish-android-armv8
            sha256: cc3b3b74466b6d85cdc0f8cfdad4111c6a44bd0698f4eab96fea7b359a54d3d4

          - abi: armeabi-v7a
            engine: stockfish-android-armv7-neon
            sha256: 672fbd7533d15fc70dae82df52c1185236975d059a585aa65eda960f1a3266ea

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Stockfish 18
        shell: bash
        run: |
          set -euo pipefail

          url="https://github.com/official-stockfish/Stockfish/releases/download/sf_18/${{ matrix.engine }}.tar"

          curl -fL --retry 3 "$url" -o stockfish.tar

          mkdir -p unpacked
          mkdir -p "app/src/main/jniLibs/${{ matrix.abi }}"

          tar -xf stockfish.tar -C unpacked

          binary="$(find unpacked -type f -name '${{ matrix.engine }}' | head -n 1)"

          test -n "$binary" || {
            echo "Stockfish binary not found"
            exit 1
          }

          echo '${{ matrix.sha256 }}  '"$binary" | sha256sum -c -

          cp "$binary" "app/src/main/jniLibs/${{ matrix.abi }}/libstockfish.so"

          chmod 755 "app/src/main/jniLibs/${{ matrix.abi }}/libstockfish.so"

      - name: Test and build DEBUG APK
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            -PtargetAbi=${{ matrix.abi }} \
            --stacktrace

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessPocket-${{ matrix.abi }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
